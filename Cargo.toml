[package]
name = "axiom-bot"
version = "0.1.0"
edition = "2021"
description = "Solana New-Coin Filter & Alert Bot (Axiom Early Column)"

[dependencies]
# Async runtime & networking
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures-util = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }

# Telegram framework
teloxide = { version = "0.13", features = ["macros"] }

# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dotenvy = "0.15"

# State & concurrency
dashmap = "6.0"
chrono = { version = "0.4", features = ["serde"] }

# Logging & error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
url = "2.5"
html-escape = "0.2"

# Solana execution & cryptographic signing
bs58 = "0.5"
bincode = "1.3"
solana-sdk = "1.17"

[profile.dev]
# opt-level 1 avoids a Windows ACCESS_VIOLATION in solana-sdk debug builds
opt-level = 1
